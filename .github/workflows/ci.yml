name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - fix/**

permissions:
  contents: read

jobs:
  web:
    name: TypeScript and web build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript check
        run: bun run lint

      - name: v18 translation regression tests
        run: bun test tests/translation-v18.test.ts

      - name: Production build
        run: bun run build

  windows-native:
    name: Tauri Rust check (Windows)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build frontend assets
        run: bun run build

      - name: Use stable Rust
        run: rustup default stable

      - name: Check Tauri backend
        run: cargo check --manifest-path src-tauri/Cargo.toml

  windows-portable:
    name: Windows portable executable
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build frontend
        run: bun run build

      - name: Use stable Rust
        run: rustup default stable

      - name: Build LexiGlass executable
        run: cargo build --release --manifest-path src-tauri/Cargo.toml

      - name: Verify executable
        shell: pwsh
        run: |
          $exe = "src-tauri/target/release/lexiglass.exe"
          if (!(Test-Path $exe)) { throw "LexiGlass executable was not produced" }
          Get-Item $exe | Select-Object FullName, Length, LastWriteTime

      - name: Upload portable executable
        uses: actions/upload-artifact@v4
        with:
          name: LexiGlass-Windows-portable-v18
          path: |
            src-tauri/target/release/lexiglass.exe
            THIRD_PARTY_DATA.md
          if-no-files-found: error
          retention-days: 14
